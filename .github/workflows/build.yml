name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    # فقط برای تگ‌های معمولی (بدون خط تیره) اجرا شود
    if: github.event_name != 'push' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-'))
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=resource/icon.ico `
            --include-data-dir=resource=resource `
            --include-module=resources_rc `
            --output-dir=build `
            --output-filename=SocialGifMaker.exe `
            --assume-yes-for-downloads `
            main.py

      - name: Zip the output folder with version
        run: |
          $VERSION = "${{ steps.get_version.outputs.VERSION }}"
          Compress-Archive -Path build/main.dist/* -DestinationPath "SocialGifMaker-$VERSION.zip"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: SocialGifMaker-${{ steps.get_version.outputs.VERSION }}.zip
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}