name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ========== Build Windows (standalone) ==========
  build-windows:
    if: github.event_name != 'push' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-'))
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Build with Nuitka (standalone)
        run: |
          python -m nuitka `
            --standalone `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=resource/icon.ico `
            --include-data-dir=resource=resource `
            --include-module=resources_rc `
            --include-package=arabic_reshaper `
            --include-package=fontTools `
            --include-package=bidi `
            --include-package=PIL `
            --output-dir=build `
            --output-filename=SocialGifMaker.exe `
            --assume-yes-for-downloads `
            main.py
      - name: Prepare final package (zip)
        id: prepare
        run: |
          $VERSION = "$env:GITHUB_REF_NAME" -replace '^v', ''
          $FOLDER_NAME = "SocialGifMaker-Windows-$VERSION"
          $ZIP_NAME = "$FOLDER_NAME.zip"
          # Rename the output folder from main.dist to the desired folder name
          Rename-Item -Path "build/main.dist" -NewName $FOLDER_NAME
          Compress-Archive -Path $FOLDER_NAME -DestinationPath $ZIP_NAME -Force
          echo "ZIP_NAME=$ZIP_NAME" >> $env:GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.prepare.outputs.ZIP_NAME }}

  # ========== Build Linux (standalone) ==========
  build-linux:
    if: github.event_name != 'push' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-util1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Build with Nuitka (standalone)
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --include-data-dir=resource=resource \
            --include-module=resources_rc \
            --include-package=arabic_reshaper \
            --include-package=fontTools \
            --include-package=bidi \
            --include-package=PIL \
            --output-dir=build \
            --output-filename=SocialGifMaker \
            --assume-yes-for-downloads \
            main.py
      - name: Prepare final package (zip)
        id: prepare
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          FOLDER_NAME="SocialGifMaker-Linux-$VERSION"
          ZIP_NAME="$FOLDER_NAME.zip"
          mv build/main.dist "$FOLDER_NAME"
          zip -r "$ZIP_NAME" "$FOLDER_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ steps.prepare.outputs.ZIP_NAME }}

  # ========== Build macOS (standalone) ==========
  build-macos:
    if: github.event_name != 'push' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-'))
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Build with Nuitka (standalone)
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --include-data-dir=resource=resource \
            --include-module=resources_rc \
            --include-package=arabic_reshaper \
            --include-package=fontTools \
            --include-package=bidi \
            --include-package=PIL \
            --output-dir=build \
            --output-filename=SocialGifMaker \
            --assume-yes-for-downloads \
            main.py
      - name: Prepare final package (zip)
        id: prepare
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          FOLDER_NAME="SocialGifMaker-macOS-$VERSION"
          ZIP_NAME="$FOLDER_NAME.zip"
          mv build/main.dist "$FOLDER_NAME"
          zip -r "$ZIP_NAME" "$FOLDER_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ steps.prepare.outputs.ZIP_NAME }}

  # ========== Create Release (after all builds succeed) ==========
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List files
        run: ls -R artifacts
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.zip
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}